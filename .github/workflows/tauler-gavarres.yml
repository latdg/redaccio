# E-taulers del Consorci de les Gavarres i de l'Ajuntament d'Ullastret — La TdG · 27.10.2026 (Ullastret, 31.10.2026)
# Anuncis de l'última setmana (dades/tauler-gavarres.json i dades/tauler-ullastret.json), a les mateixes
# hores que el resum del panell (6, 9, 12, 15, 18 i 23 h, hora d'hivern).
name: E-taulers (Consorci de les Gavarres i Ullastret)

on:
  schedule:
    - cron: "11 5,8,11,14,17,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tauler-gavarres
  cancel-in-progress: false

jobs:
  gavarres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Genera i desa
        run: |
          python taulers/gavarres.py 2>&1 | tee taulers/registre.txt
          git config user.name "La TdG (e-tauler Gavarres)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dades/tauler-gavarres.json dades/tauler-ullastret.json taulers/registre.txt
          if git diff --cached --quiet; then echo "Sense canvis"; exit 0; fi
          git commit -qm "E-taulers (Gavarres i Ullastret) ($(TZ=Europe/Madrid date '+%d.%m.%Y %H.%M'))"
          for intent in 1 2 3 4 5 6; do
            git push -q origin HEAD:main && exit 0
            sleep $((intent * 10))
            git fetch -q origin main && git rebase -q origin/main || { git rebase --abort; exit 1; }
          done
          echo "No s'han pogut pujar els canvis"; exit 1
