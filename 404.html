<script>
// Si es recarrega una pàgina interna de l'editor de vídeo (FreeCut), GitHub Pages no la troba:
// es torna a l'editor i aquest recupera la ruta.
(function () {
  var base = "/redaccio/video/editor/", p = location.pathname;
  if (p.indexOf(base) === 0) {
    var q = location.search ? location.search.slice(1) + "&" : "";
    location.replace(base + "?" + q + "ruta=" + encodeURIComponent(p.slice(base.length)) + location.hash);
  }
})();
</script>
