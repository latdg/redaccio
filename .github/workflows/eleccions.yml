# Resultats electorals — La TdG · 26.10.2026
# Baixa del Ministeri de l'Interior els resultats mesa a mesa de les eleccions
# de eleccions/eleccions.py i desa dades/eleccions.json. Els resultats no
# canvien: es llança a mà quan s'afegeix una elecció nova a la llista.
name: Resultats electorals

on:
  # 31.10.2026: un cop al mes, per si la Generalitat hi afegeix una convocatòria nova.
  schedule:
    - cron: "41 3 2 * *"
  workflow_dispatch:
    inputs:
      forca:
        description: "Torna a baixar també les eleccions que ja hi són"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # 31.10.2026: per tornar-se a llançar si queden eleccions per baixar

concurrency:
  group: eleccions
  cancel-in-progress: false

jobs:
  eleccions:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Prova la connexió
        run: curl -sS -m 30 -o /dev/null -w "%{http_code} %{time_total}s\n" -I https://infoelectoral.interior.gob.es/estaticos/docxl/apliextr/04202305_MESA.zip > eleccions/connexio.txt 2>&1 || true
      - name: Genera i desa
        run: |
          python eleccions/eleccions.py ${{ inputs.forca && '--forca' || '' }}
          git config user.name "La TdG (eleccions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 27.10.2026: si un altre procés ha pujat canvis alhora, es torna a provar; si no hi ha manera, el workflow falla (no es perd en silenci).
          git add -A eleccions/;   # 31.10.2026: també pendents.txt (o que s'hagi esborrat) [ -f dades/eleccions.json ] && git add dades/eleccions.json
          if git diff --cached --quiet; then echo "Sense canvis"; exit 0; fi
          git commit -qm "Resultats electorals ($(TZ=Europe/Madrid date '+%d.%m.%Y'))"
          for intent in 1 2 3 4 5 6; do
            git push -q origin HEAD:main && exit 0
            sleep $((intent * 10))
            git fetch -q origin main && git rebase -q origin/main || { git rebase --abort; exit 1; }
          done
          echo "No s'han pogut pujar els canvis"; exit 1
      # 31.10.2026: si s'ha esgotat el temps i en queden per baixar, es torna a llançar sol.
      - name: Continua si en queden
        if: ${{ hashFiles('eleccions/pendents.txt') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run eleccions.yml --ref main -R ${{ github.repository }}
