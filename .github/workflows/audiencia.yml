# Audiència i ajuts per a mitjans — La TdG · 08.11.2026
# Cada dia: seguidors i interaccions (Bluesky, Mastodon, Telegram) a dades/audiencia.json
# i convocatòries d'ajuts per a mitjans (BDNS) a dades/ajuts-mitjans.json, amb avís de
# les noves al bot LaTdG_infos. Secrets opcionals: TELEGRAM_BOT_TOKEN_CANAL,
# TELEGRAM_BOT_TOKEN_INFOS i TELEGRAM_CHAT_ID_INFOS.
name: Audiència i ajuts

on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audiencia
  cancel-in-progress: false

jobs:
  audiencia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Recull i desa
        env:
          TELEGRAM_BOT_TOKEN_CANAL: ${{ secrets.TELEGRAM_BOT_TOKEN_CANAL }}
          TELEGRAM_BOT_TOKEN_INFOS: ${{ secrets.TELEGRAM_BOT_TOKEN_INFOS }}
          TELEGRAM_CHAT_ID_INFOS: ${{ secrets.TELEGRAM_CHAT_ID_INFOS }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHAPI_CANAL: ${{ secrets.WHAPI_CANAL }}
        run: |
          python audiencia/audiencia.py 2>&1 | tee audiencia/registre.txt
          git config user.name "La TdG (audiència)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audiencia/registre.txt dades/audiencia.json dades/ajuts-mitjans.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Sense canvis"; exit 0; fi
          git commit -qm "Audiència i ajuts ($(TZ=Europe/Madrid date '+%d.%m.%Y'))"
          for intent in 1 2 3 4 5 6; do
            git push -q origin HEAD:main && exit 0
            sleep $((intent * 10))
            git fetch -q origin main && git rebase -q origin/main || { git rebase --abort; exit 1; }
          done
          echo "No s'han pogut pujar els canvis"; exit 1
