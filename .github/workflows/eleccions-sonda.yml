# Sonda dels resultats electorals (31.10.2026). Només a mà.
name: Sonda eleccions
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests && python eleccions/sonda.py || true
      - run: |
          git config user.name "La TdG (sonda)"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eleccions/sonda.txt && git commit -qm "Sonda eleccions" && for i in 1 2 3 4; do git pull -q --rebase && git push -q && break; sleep 5; done || true
