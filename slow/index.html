<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="robots" content="noindex, nofollow">
<title>La TdG slow</title>
<!--
  LA TdG SLOW — La TdG · 31.10.2026
  Blocs de menys actualització, per analitzar a la redacció. No té dades pròpies:
  reuneix, amb la mateixa capçalera, els blocs «slow» de La TdG redacció (des de la
  contractació pública, l'11, fins al final) i els de La TdG ampliada (edat dels
  edificis, piezòmetres, plaques solars i consum elèctric, preu de l'aigua, atur i
  afiliació). Cada part és la seva pàgina de sempre carregada amb ?slow&incrustat,
  de manera que qualsevol millora d'aquells blocs surt aquí sola.
  31.10.2026: els blocs van per àmbits (vegeu TROSSOS): cada tros és un iframe amb
  &blocs=... i els fitxers de dades es baixen un sol cop per a tots (window.__cauSlow).
  Els crèdits dels escuts, al peu.
-->
<style>
:root{--fons:#f6f5f2;--targeta:#fff;--text:#1d1d1b;--suau:#6b6b66;--linia:#e3e1db;--accent:#b4462c}
*{box-sizing:border-box}
body{margin:0;background:var(--fons);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header,footer{max-width:1100px;margin:0 auto;padding-left:16px;padding-right:16px}
header{padding-top:24px;padding-bottom:16px}
h1{margin:0;font-size:1.6rem}
.sub{color:var(--suau);margin:4px 0 12px}
.capcalera{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.capcalera .dreta{margin-left:auto;display:flex;gap:12px;flex-wrap:wrap}
.podcast{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--text);line-height:1.1;flex-shrink:0}
.podcast svg{display:block;width:50px;height:50px}
a{color:var(--accent)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
nav a{color:var(--text);text-decoration:none;font-size:.85rem;padding:3px 10px;border:1px solid var(--linia);border-radius:999px;background:var(--targeta);white-space:nowrap}
nav a:hover{color:var(--accent);border-color:var(--accent)}
nav .grup{flex-basis:100%;font-size:.8rem;color:var(--suau);margin-top:6px}
#parts{display:grid;gap:16px}
.part{display:block;width:100%;border:0;height:400px;background:transparent;overflow:hidden}
.titol-part{max-width:1100px;margin:16px auto 0;padding:0 16px;font-size:.85rem;color:var(--suau);text-transform:uppercase;letter-spacing:.04em}
footer{color:var(--suau);font-size:.85rem;padding-bottom:32px;padding-top:4px}
#creditsEscuts{margin:0}
</style>
</head>
<body>
<header>
  <div class="capcalera">
    <a class="podcast" href="https://laguait.cat/latdg" target="_blank" rel="noopener" title="Visita el pòdcast">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Visita el pòdcast">
        <path d="M2 11a10 10 0 015-8.662" stroke="#e30613"/>
        <path d="M22 11a10 10 0 00-5-8.662" stroke="#e30613"/>
        <path d="M6 11a6 6 0 013-5.197" stroke="currentColor"/>
        <path d="M18 11a6 6 0 00-3-5.197" stroke="currentColor"/>
        <rect x="10" y="9" width="4" height="8" rx="2" stroke="currentColor"/>
        <path d="M12 17v4" stroke="currentColor"/>
        <path d="M9 21h6" stroke="currentColor"/>
      </svg>
    </a>
    <h1>La TdG slow 🐢</h1>
    <div class="dreta">
      <a href="../">← La TdG redacció</a>
      <a href="https://latdg.github.io/tauler/" target="_blank" rel="noopener">La TdG ampliada ↗</a>
    </div>
  </div>
  <p class="sub">Blocs de menys actualització, amb dades per analitzar a la redacció.</p>
  <nav id="nav"></nav>
</header>

<div id="parts"></div>

<footer><p id="creditsEscuts"></p>Aquest espai és una gentilesa dels serveis informatius de la Bisbal d'Empordà i pobles veïns.</footer>

<script>
// 31.10.2026: ORDRE PER ÀMBITS. Cada tros és una de les dues pàgines amb els blocs
// indicats, en aquest ordre. R = La TdG redacció, A = La TdG ampliada. Els resultats
// electorals sempre al final. Un bloc slow nou que no sigui aquí surt igualment (a
// l'últim tros de cada pàgina, abans de les eleccions).
const TROSSOS = [
  // Diners públics: dades municipals, contractació, subvencions, obres (PUOSC); rendes.
  ["R", ["dades-municipals", "contractacio", "subvencions", "puosc", "renda"]],
  // Treball; habitatge (edat dels edificis, lloguer i pisos buits, ús turístic) i turisme.
  ["A", ["atur", "edificis"]],
  ["R", ["habitatge", "hut", "turisme", "aigua"]],
  // Aigua (potable, preu, subterrània) i energia.
  ["A", ["preu-aigua", "piezometres", "energia"]],
  // Residus, ramaderia, seguretat, escoles, entitats i, per acabar, les eleccions.
  ["R", ["residus", "ramaderia", "seguretat", "escoles", "entitats", "eleccions"]],
];
const PAGINA = { R: "../", A: "../../tauler/" };
// 31.10.2026: es canvia a cada canvi de les pàgines, perquè el navegador no faci servir
// una còpia antiga (que no sabria triar els blocs i els mostraria tots, repetits).
const VERSIO = "20261031d";
const PARTS = TROSSOS.map(([pag, blocs], i) => {
  const altres = TROSSOS.filter(([p], j) => p === pag && j !== i).flatMap(([, b]) => b);
  const ultim = TROSSOS.map(([p]) => p).lastIndexOf(pag) === i;
  const src = PAGINA[pag] + "?slow&incrustat&blocs=" + blocs.join(",") + (altres.length ? "&altres=" + altres.join(",") : "") + (ultim ? "&resta" : "") + "&v=" + VERSIO;
  const fr = document.createElement("iframe");
  fr.className = "part"; fr.id = "part" + i; fr.scrolling = "no";
  fr.title = "Blocs slow de " + (pag === "R" ? "La TdG redacció" : "La TdG ampliada");
  fr.src = src;
  document.getElementById("parts").appendChild(fr);
  return [fr.id];
});

// Crèdits dels escuts (abans dins dels resultats electorals).
fetch("../escuts/credits.json?v=" + Date.now()).then(r => r.json()).then(c => {
  const esc = s => String(s ?? "").replace(/[&<>"]/g, x => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[x]));
  const v = Object.entries(c).filter(([k]) => !k.startsWith("_")).map(([, x]) => x);
  const commons = v.filter(x => x && x.pagina).map(x => `<a href="${esc(x.pagina)}" target="_blank" rel="noopener">${esc(x.llicencia || "Commons")}</a>`).join(", ");
  const local = c["17901"] && c["17901"].local ? "; el de Cruïlles, Monells i Sant Sadurní de l'Heura, de l'Ajuntament" : "";
  if (commons) document.getElementById("creditsEscuts").innerHTML = `Escuts: Wikimedia Commons (${commons}${local}).`;
}).catch(() => {});

// Cada part creix tant com el seu contingut (són de la mateixa adreça, latdg.github.io),
// i la barra de navegació porta a cada bloc de dins.

// 31.10.2026: per si de cas, un bloc que ja surt en un tros anterior no es repeteix.
function treuRepetits() {
  const vistos = new Set();
  PARTS.forEach(([id]) => {
    let doc = null;
    try { doc = document.getElementById(id).contentDocument; } catch (e) {}
    // Només els trossos que ja han triat els seus blocs (abans es veurien tots).
    if (!doc || !doc.documentElement.dataset.triat) return;
    doc.querySelectorAll("main section").forEach(s => {
      if (s.hidden) return;
      const h2 = s.querySelector("h2");
      const clau = s.dataset.clau || (h2 ? h2.textContent.replace(/[^\p{L}\p{N}]/gu, "").toLowerCase() : "");
      if (!clau) return;
      if (vistos.has(clau)) s.hidden = true; else vistos.add(clau);
    });
  });
}

// La navegació es refà cada cop que canvia el contingut (les dades arriben a poc a poc).
let tempsNav = null;
const refesNav = () => { clearTimeout(tempsNav); tempsNav = setTimeout(navegacio, 300); };

function ajusta(fr) {
  treuRepetits();
  refesNav();
  try {
    const doc = fr.contentDocument;
    if (!doc || !doc.body) return;
    // 31.10.2026: l'alçada és la del contingut (fins a l'últim bloc visible). Abans es
    // feia servir scrollHeight, que mai no baixa de l'alçada de l'iframe i deixava
    // un espai buit enorme quan els blocs es plegaven o carregaven més curts.
    const blocs = Array.from(doc.querySelectorAll("main > *, main section")).filter(x => !x.hidden && x.offsetParent !== null);
    const fi = blocs.reduce((m, x) => Math.max(m, x.getBoundingClientRect().bottom), 0) + (doc.defaultView.scrollY || 0);
    // Un tros sense cap bloc visible (encara carregant o sense dades) no ocupa lloc.
    fr.style.height = fi > 0 ? Math.ceil(fi + 16) + "px" : "0px";
  } catch (e) { /* si un dia no fos la mateixa adreça, es queda amb l'alçada per defecte */ }
}

// 31.10.2026: les etiquetes són les mateixes que fa servir cada panell a la seva barra
// (sense emoticones, inicial majúscula), totes seguides, sense dir d'on vénen.
function navegacio() {
  const nav = document.getElementById("nav");
  let h = "";
  PARTS.forEach(([id]) => {
    const fr = document.getElementById(id);
    let doc = null;
    try { doc = fr.contentDocument; } catch (e) {}
    if (!doc) return;
    // 31.10.2026: un enllaç per cada bloc visible, en l'ordre en què surt (no el
    // contenidor general «Resum», que no és cap apartat).
    const enllacos = Array.from(doc.querySelectorAll('header nav a[href^="#"]'));
    Array.from(doc.querySelectorAll("main section[id]")).forEach(sec => {
      if (sec.hidden || sec.offsetParent === null) return;
      const a = enllacos.find(x => x.getAttribute("href") === "#" + sec.id);
      if (!a) return;
      let t = a.textContent.replace(/[^\p{L}\p{N}(),'’·\- ]/gu, "").replace(/\s+/g, " ").trim();
      if (!t) return;
      t = t.charAt(0).toUpperCase() + t.slice(1);
      h += `<a href="#" data-part="${id}" data-sec="${sec.id}">${t.replace(/[<>&]/g, "")}</a>`;
    });
  });
  nav.innerHTML = h;
  nav.querySelectorAll("a").forEach(a => a.onclick = ev => {
    ev.preventDefault();
    const fr = document.getElementById(a.dataset.part);
    const s = fr.contentDocument.getElementById(a.dataset.sec);
    if (!s) return;
    window.scrollTo({ top: fr.getBoundingClientRect().top + window.scrollY + s.getBoundingClientRect().top - 12, behavior: "smooth" });
  });
}

PARTS.forEach(([id]) => {
  const fr = document.getElementById(id);
  fr.addEventListener("load", () => {
    ajusta(fr);
    try {
      const ro = new ResizeObserver(() => { ajusta(fr); });
      ro.observe(fr.contentDocument.body);
      const mn = fr.contentDocument.querySelector("main"); if (mn) ro.observe(mn);
      // Els enllaços de dins que porten a una altra pàgina s'obren fora de l'iframe.
      fr.contentDocument.addEventListener("click", ev => {
        const a = ev.target.closest && ev.target.closest("a[href]");
        if (a && !a.getAttribute("href").startsWith("#") && !a.target) a.target = "_top";
      }, true);
    } catch (e) {}
    // La navegació es refà mentre les dades van arribant.
    [800, 2500, 6000, 12000, 20000].forEach(ms => setTimeout(() => { ajusta(fr); navegacio(); }, ms));
  });
});
</script>
</body>
</html>
