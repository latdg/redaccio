# Motor de transcripció al navegador per a l'estudi d'àudio — La TdG · 21.11.2026
# Compila sherpa-onnx en WebAssembly (VAD + reconeixement) amb només el detector de
# veu (Silero VAD) a dins; el model Aina es baixa a part (audio/transcriu/model/).
# Desa el resultat a audio/transcriu/wasm/. Només cal executar-lo un cop.
name: Motor de transcripció (WebAssembly)

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/wasm-transcriu.yml

permissions:
  contents: write

env:
  SHERPA_TAG: v2.0.2

jobs:
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Baixa sherpa-onnx
        run: |
          git clone -q --depth 1 --branch $SHERPA_TAG https://github.com/k2-fsa/sherpa-onnx sherpa
          # La versió d'Emscripten que l'script de sherpa-onnx diu que funciona
          V=$(grep -o "emsdk install [0-9.]*" sherpa/build-wasm-simd-vad-asr.sh | head -1 | grep -o "[0-9.]*$")
          echo "EMSDK_V=${V:-4.0.23}" >> $GITHUB_ENV
          ls sherpa/wasm/vad-asr
      - name: Emscripten
        run: |
          git clone -q --depth 1 https://github.com/emscripten-core/emsdk
          cd emsdk && ./emsdk install $EMSDK_V > /dev/null && ./emsdk activate $EMSDK_V > /dev/null
      - name: Compila
        run: |
          source emsdk/emsdk_env.sh > /dev/null
          cd sherpa
          mkdir -p wasm/vad-asr/assets
          cp ../audio/transcriu/model/tokens.txt wasm/vad-asr/assets/
          curl -sSL -o wasm/vad-asr/assets/silero_vad.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
          ls -la wasm/vad-asr/assets
          ./build-wasm-simd-vad-asr.sh > ../compila.log 2>&1 || { tail -80 ../compila.log; cd ..; mkdir -p audio/transcriu; tail -150 compila.log > audio/transcriu/error-compilacio.log; git config user.name "La TdG (motor de transcripció)"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"; git add audio/transcriu/error-compilacio.log; git commit -qm "Error de compilació del motor"; git pull -q --rebase origin main; git push -q origin HEAD:main; exit 1; }
          tail -5 ../compila.log
          ls -la build-wasm-simd-vad-asr/install/bin/wasm/vad-asr
      - name: Desa
        run: |
          D=audio/transcriu/wasm
          rm -rf $D && mkdir -p $D
          S=sherpa/build-wasm-simd-vad-asr/install/bin/wasm/vad-asr
          cp $S/sherpa-onnx-wasm-main-vad-asr.js $S/sherpa-onnx-wasm-main-vad-asr.wasm $S/sherpa-onnx-wasm-main-vad-asr.data $S/sherpa-onnx-asr.js $S/sherpa-onnx-vad.js $D/
          cp $S/app-vad-asr.js $D/app-original.js
          cp sherpa/LICENSE $D/LICENSE
          echo "sherpa-onnx $SHERPA_TAG (Apache-2.0), emsdk $EMSDK_V" > $D/VERSIO.txt
          ls -la $D
          git config user.name "La TdG (motor de transcripció)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch audio/transcriu/error-compilacio.log
          git add $D
          git commit -qm "Motor de transcripció en WebAssembly (sherpa-onnx $SHERPA_TAG)"
          for intent in 1 2 3 4 5 6; do
            git push -q origin HEAD:main && exit 0
            sleep $((intent * 5))
            git pull -q --rebase origin main || { git rebase --abort; exit 1; }
          done
          exit 1
