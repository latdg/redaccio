# Seguretat i emergències — La TdG · 27.10.2026
# Fets penals (Mossos, ABP la Bisbal), actuacions dels Bombers i incidents del
# 112 dels quatre municipis (dades/seguretat.json). Cada dilluns; també a mà.
name: Seguretat i emergències

on:
  schedule:
    - cron: "53 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seguretat
  cancel-in-progress: false

jobs:
  seguretat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Genera i desa
        run: |
          python seguretat/seguretat.py 2>&1 | tee seguretat/registre.txt
          git config user.name "La TdG (seguretat)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 27.10.2026: si un altre procés ha pujat canvis alhora, es torna a provar; si no hi ha manera, el workflow falla (no es perd en silenci).
          git add seguretat/registre.txt; git add dades/seguretat.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Sense canvis"; exit 0; fi
          git commit -qm "Seguretat i emergències ($(TZ=Europe/Madrid date '+%d.%m.%Y'))"
          for intent in 1 2 3 4 5 6; do
            git push -q origin HEAD:main && exit 0
            sleep $((intent * 10))
            git fetch -q origin main && git rebase -q origin/main || { git rebase --abort; exit 1; }
          done
          echo "No s'han pogut pujar els canvis"; exit 1
