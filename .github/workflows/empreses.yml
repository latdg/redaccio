# Estructura empresarial (Diputació de Girona) — La TdG · 09.11.2026
# L'estudi surt un cop l'any (a la tardor). Cada dilluns es mira si n'hi ha una
# edició nova; si n'hi ha, se'n desa el text (empreses/text) i se'n treuen les
# dades dels cinc municipis cap a dades/empreses.json (bloc de La TdG dades).
name: Estructura empresarial

on:
  schedule:
    - cron: "53 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: empreses
  cancel-in-progress: false

jobs:
  empreses:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get install -y -qq poppler-utils >/dev/null
          pip install requests
      - name: Busca, baixa i desa
        run: |
          python empreses/baixa.py
          if [ -f empreses/empreses.py ]; then python empreses/empreses.py; fi
          git config user.name "La TdG (empreses)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add empreses/text empreses/estat.json
          [ -f dades/empreses.json ] && git add dades/empreses.json
          if git diff --cached --quiet; then echo "Sense canvis"; exit 0; fi
          git commit -qm "Estructura empresarial ($(TZ=Europe/Madrid date '+%d.%m.%Y'))"
          for intent in 1 2 3 4 5 6; do
            git push -q origin HEAD:main && exit 0
            sleep $((intent * 10))
            git fetch -q origin main && git rebase -q origin/main || { git rebase --abort; exit 1; }
          done
          echo "No s'han pogut pujar els canvis"; exit 1
