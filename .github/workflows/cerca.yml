# Índex de la cerca — La TdG · 01.11.2026
# Refà l'índex de Pagefind (cerca/pagefind/) amb tots els resums diaris del
# panell (dades/<dia>/resum.html), perquè la pàgina cerca/ hi pugui buscar.
# S'engega sol cada vegada que es desa un resum, o a mà.
name: Índex de la cerca

on:
  push:
    branches: [main]
    paths: ["dades/*/resum.html"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cerca
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fa l'índex
        run: |
          rm -rf cerca/pagefind
          npx -y pagefind@1 --site . --glob "dades/*/resum.html" --output-subdir cerca/pagefind --force-language ca
      - name: Desa l'índex
        run: |
          git config user.name "La TdG (cerca)"
          git config user.email "latdg@laguait.cat"
          git add -A cerca/pagefind
          if git diff --cached --quiet; then echo "Índex sense canvis."; exit 0; fi
          git commit -q -m "Índex de la cerca ($(TZ=Europe/Madrid date '+%d.%m.%Y %H.%M'))"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::error::No s'ha pogut desar l'índex."; exit 1
