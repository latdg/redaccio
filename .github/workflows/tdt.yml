# TDT i ràdio — La TdG · 05.11.2026
# Un cop al dia baixa les llistes de TDTChannels (tv.json i radio.json) a tdt/,
# i còpia dels logotips nous a tdt/logos/ (els que ja hi són no es tornen a baixar).
# 14.11.2026: i la programació (tdt/epg.json); a les altres hores, només la programació.
# 22.11.2026: a la mateixa hora (04.17), també la llista del món d'iptv-org (tdt/mon.json).
# 28.11.2026: i els vídeos del canal de YouTube de L'aguait TV (tdt/aguait.json), per a la Videoteca de L'aguait.
name: La TdG sala de control audiovisual (llistes de TDT i ràdio)

on:
  schedule:
    - cron: "17 4 * * *"
    - cron: "47 10,16,22 * * *"
  workflow_dispatch:
    inputs:
      nomes_aguait: { description: "1 = només la Videoteca de L'aguait", required: false, default: "0" }

permissions:
  contents: write

jobs:
  llistes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests yt-dlp
      - name: Baixa i desa
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ "${{ inputs.nomes_aguait }}" = "1" ]; then python tdt/aguait.py; elif [ "${{ github.event.schedule }}" = "47 10,16,22 * * *" ]; then python tdt/actualitza.py epg; else python tdt/actualitza.py; python tdt/aguait.py; fi
          git config user.name "La TdG (TDT)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tdt/tv.json tdt/radio.json tdt/logos
          [ -f tdt/epg.json ] && git add tdt/epg.json
          [ -f tdt/mon.json ] && git add tdt/mon.json
          [ -f tdt/aguait.json ] && git add tdt/aguait.json
          if git diff --cached --quiet; then echo "Sense canvis"; exit 0; fi
          git commit -qm "Llistes i programació de TDT i ràdio"
          for intent in 1 2 3 4 5 6; do
            git push -q origin HEAD:main && exit 0
            sleep $((intent * 5))
            git pull -q --rebase origin main || { git rebase --abort; exit 1; }
          done
          echo "No s'han pogut pujar els canvis"; exit 1
