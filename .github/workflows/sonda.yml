name: Sonda (recerca, temporal)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python sonda.py
      - run: |
          git config user.name "La TdG (recerca)"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultat.json && git commit -qm "Resultat de la sonda" && git push -q origin HEAD:recerca
